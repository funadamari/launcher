<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>画像ビューアを開いています</title>

<style>

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;
  color: #fff;

  font-family: sans-serif;

}

#message {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 90%;

  max-width: 500px;

  text-align: center;

  line-height: 1.7;

}

#openButton {

  display: none;

  margin-top: 20px;

  padding: 12px 24px;

  border: none;

  border-radius: 6px;

  background: #fff;

  color: #111;

  font-size: 16px;

  cursor: pointer;

}

</style>

</head>


<body>


<div id="message">

  <div id="messageText">
    画像ビューアを開いています…
  </div>

  <button
    id="openButton"
    type="button">

    ビューアを開く

  </button>

</div>


<script>

/* =========================================================
   設定
   ========================================================= */

const SERVICE_WORKER_URL =
  "/sw.js";

const SERVICE_WORKER_REQUEST =
  "funadamariServiceWorkerRequest";


const ACTIVE_VIEWER_KEY =
  "funadamariActiveViewer";


const VIEWER_URL =
  "/viewer/";


const VIEWER_WINDOW_NAME =
  "funadamariViewer";


/* =========================================================
   URLパラメータ
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const imageURL =
  params.get("image") || "";


const titleText =
  params.get("title") || "";


/* =========================================================
   HTML
   ========================================================= */

const messageText =
  document.getElementById(
    "messageText"
  );


const openButton =
  document.getElementById(
    "openButton"
  );


/* =========================================================
   launcherを閉じる
   ========================================================= */

function closeLauncher() {

  setTimeout(function () {

    try {

      window.close();

    }
    catch (error) {

      // ignore

    }

  }, 100);

}


/* =========================================================
   「ビューアを開く」ボタンを表示
   ========================================================= */

function showOpenButton(message) {

  messageText.innerHTML =
    message;

  openButton.style.display =
    "inline-block";

}


/* =========================================================
   Active Viewerが存在するか確認
   ========================================================= */

function hasActiveViewer() {

  try {

    const raw =
      localStorage.getItem(
        ACTIVE_VIEWER_KEY
      );


    if (!raw) {

      return false;

    }


    const data =
      JSON.parse(raw);


    if (!data || !data.id) {

      return false;

    }


    /*
     古い情報が残っている場合に備えて
     30秒以上古い登録は無効とする。
    */

    if (
      typeof data.timestamp === "number" &&
      Date.now() - data.timestamp > 30000
    ) {

      return false;

    }


    return true;

  }
  catch (error) {

    console.warn(
      "active viewer check failed:",
      error
    );

    return false;

  }

}


/* =========================================================
   Viewer URLを作成
   ========================================================= */

function createViewerURL() {

  const viewerURL =
    new URL(
      VIEWER_URL,
      window.location.origin
    );


  if (imageURL) {

    viewerURL.searchParams.set(
      "image",
      imageURL
    );

  }


  if (titleText) {

    viewerURL.searchParams.set(
      "title",
      titleText
    );

  }


  return viewerURL.href;

}


/* =========================================================
   初回：
   直接window.open()でviewerを開く
   ========================================================= */

function openNewViewer() {

  if (!imageURL) {

    messageText.textContent =
      "画像URLが指定されていません。";

    return;

  }


  const url =
    createViewerURL();


  /*
   ここが非常に重要。

   このwindow.open()は
   ボタンのclickイベントから直接呼ぶ。

   setTimeout()やawaitを
   この前に入れない。
  */

  const viewerWindow =
    window.open(
      url,
      VIEWER_WINDOW_NAME
    );


  if (!viewerWindow) {

    messageText.innerHTML =
      "ビューアを開けませんでした。<br>" +
      "ブラウザのポップアップブロックを確認してください。";

    openButton.style.display =
      "inline-block";

    return;

  }


  /*
  既存viewerへの送信。
  
  viewerが前面になれば、
  launcherは不要になる。
  
  ただし、focus()がブラウザによって
  拒否された場合に備えて、
  今回はlauncherをすぐ閉じない。
  */
  
  setTimeout(
    function () {
    
      window.close();
    
    },
    500
  );
}


/* =========================================================
   既存viewerへService Worker経由で送る
   ========================================================= */

async function sendToExistingViewer() {

  if (!imageURL) {

    messageText.textContent =
      "画像URLが指定されていません。";

    return;

  }


  if (
    !("serviceWorker" in navigator)
  ) {

    /*
     Service Workerが使えない場合は
     既存viewerを直接操作できない。

     そのためボタン方式に戻す。
    */

    showOpenButton(
      "ビューアを操作できませんでした。"
    );

    return;

  }


  try {

    /*
     Service Workerを登録
    */

    const registration =
      await navigator.serviceWorker.register(
        SERVICE_WORKER_URL,
        {
          scope: "/"
        }
      );


    /*
     Service Workerがactiveになるまで待つ
    */

    await navigator.serviceWorker.ready;


    const worker =
      navigator.serviceWorker.controller ||
      registration.active;


    if (!worker) {

      showOpenButton(
        "ビューアを操作できませんでした。"
      );

      return;

    }


    /*
     既存viewerへ要求
    */

    worker.postMessage({

      type:
        SERVICE_WORKER_REQUEST,

      image:
        imageURL,

      title:
        titleText

    });


    /*
     launcherは不要なので閉じる
    */

    closeLauncher();

  }
  catch (error) {

    console.error(
      "Service Worker error:",
      error
    );


    showOpenButton(
      "ビューアを操作できませんでした。<br>" +
      "もう一度お試しください。"
    );

  }

}


/* =========================================================
   ボタン
   ========================================================= */

openButton.addEventListener(
  "click",
  function () {

    /*
     ボタンから直接window.open()する。

     ここにはawaitやsetTimeoutを入れない。
    */

    openNewViewer();

  }
);


/* =========================================================
   初期処理
   ========================================================= */

if (!imageURL) {

  messageText.textContent =
    "画像URLが指定されていません。";

}
else {

  /*
   まず既存viewerがあるか確認する。
  */

  if (hasActiveViewer()) {

    /*
     既存viewerがある場合は、
     Service Workerから画像を変更する。
    */

    messageText.textContent =
      "既存のビューアを更新しています…";


    sendToExistingViewer();

  }
  else {

    /*
     viewerがまだない。

     初回なのでボタンを表示する。
    */

    showOpenButton(
      "画像ビューアを開きます。<br>" +
      "下のボタンを押してください。"
    );

  }

}

</script>

</body>

</html>
