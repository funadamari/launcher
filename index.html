<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>画像ビューアを開いています</title>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family: sans-serif;

}


#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;

}


#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;

}

</style>

</head>


<body>


<div id="message">

    <div id="messageText">
        画像ビューアを開いています…
    </div>

    <button
        id="openButton"
        type="button">
        ビューアを開く
    </button>

</div>


<script>


/* =========================================================
   設定
========================================================= */

const VIEWER_URL =
    "https://funadamari.github.io/viewer/";


const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


const VIEWER_WINDOW_NAME =
    "funadamariViewer";


const REQUEST_VALID_TIME =
    30 * 1000;


/* =========================================================
   URLパラメータ
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const imageURL =
    params.get("image") || "";


const titleText =
    params.get("title") || "";


/* =========================================================
   HTML
========================================================= */

const messageText =
    document.getElementById(
        "messageText"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


/* =========================================================
   Viewer URL作成
========================================================= */

function makeViewerURL() {

    const viewerParams =
        new URLSearchParams();


    if (imageURL) {

        viewerParams.set(
            "image",
            imageURL
        );

    }


    if (titleText) {

        viewerParams.set(
            "title",
            titleText
        );

    }


    return (
        VIEWER_URL +
        "?" +
        viewerParams.toString()
    );

}


/* =========================================================
   Active viewer情報
========================================================= */

function getActiveViewerInfo() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return null;

        }


        const info =
            JSON.parse(raw);


        if (
            !info ||
            !info.id
        ) {

            return null;

        }


        if (info.timestamp) {

            const age =
                Date.now() -
                Number(info.timestamp);


            if (
                age >
                REQUEST_VALID_TIME
            ) {

                return null;

            }

        }


        return info;

    }
    catch (error) {

        return null;

    }

}


/* =========================================================
   Viewer request保存
========================================================= */

function saveViewerRequest(
    targetViewerId
) {

    try {

        localStorage.setItem(

            VIEWER_STORAGE_KEY,

            JSON.stringify({

                image:
                    imageURL,

                title:
                    titleText,

                timestamp:
                    Date.now(),

                targetViewerId:
                    targetViewerId

            })

        );


        return true;

    }
    catch (error) {

        console.error(
            "viewer request error:",
            error
        );


        return false;

    }

}


/* =========================================================
   Launcherを閉じる
========================================================= */

function closeLauncher() {

    setTimeout(
        function () {

            try {

                window.close();

            }
            catch (error) {

                // ignore

            }

        },
        100
    );

}


/* =========================================================
   ボタン表示
========================================================= */

function showOpenButton(
    message
) {

    messageText.innerHTML =
        message;


    openButton.style.display =
        "inline-block";

}


/* =========================================================
   viewerを開く
========================================================= */

function openViewer() {

    if (!imageURL) {

        messageText.textContent =
            "画像URLが指定されていません。";

        return;

    }


    /*
       =====================================================
       重要
       =====================================================

       既存viewerがある場合でも、
       window.open()でabout:blankを作らない。

       ただし今回は「viewerを前面化する」ため、
       名前付きwindowを取得する必要がある。

       viewer URLを指定してopenすることで、
       既存の名前付きwindowがあれば
       それを再利用する。
    */

    let viewerWindow = null;


    try {

        viewerWindow =
            window.open(
                makeViewerURL(),
                VIEWER_WINDOW_NAME
            );

    }
    catch (error) {

        console.error(
            "window.open error:",
            error
        );

    }


    if (!viewerWindow) {

        showOpenButton(
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

        return;

    }


    /*
       viewerが既に存在する場合は、
       window.open()によってそのviewerが
       前面になることを期待する。

       新規viewerの場合も同じ。
    */

    try {

        viewerWindow.focus();

    }
    catch (error) {

        console.warn(
            "viewer focus failed:",
            error
        );

    }


    /*
       念のためactive viewer情報があれば、
       画像変更要求も送る。

       viewerが新規読み込みの場合はURLから
       直接画像を表示するため不要だが、
       既存viewerの再利用時には補助になる。
    */

    const activeInfo =
        getActiveViewerInfo();


    if (
        activeInfo &&
        activeInfo.id
    ) {

        saveViewerRequest(
            activeInfo.id
        );

    }


    closeLauncher();

}


/* =========================================================
   ボタン
========================================================= */

openButton.addEventListener(
    "click",
    function () {

        openViewer();

    }
);


/* =========================================================
   初期処理
========================================================= */

if (!imageURL) {

    messageText.textContent =
        "画像URLが指定されていません。";

}
else {

    openViewer();

}


</script>

</body>

</html>
