<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>画像ビューアを開いています</title>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family: sans-serif;
}


#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;
}


#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;

}

</style>

</head>


<body>


<div id="message">

    <div id="messageText">
        画像ビューアを確認しています…
    </div>

    <button id="openButton">
        ビューアを開く
    </button>

</div>


<script>


/* =========================================================
   設定
========================================================= */


const VIEWER_URL =
    "https://funadamari.github.io/viewer/";


const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   viewerがactiveとして登録されてから
   どの程度の時間なら有効とみなすか
*/
const ACTIVE_VIEWER_VALID_TIME =
    60 * 1000;


/*
   viewerを開く際に使用するwindow名
*/
const WINDOW_NAME =
    "funadamariViewer";



/* =========================================================
   URLパラメータ
========================================================= */


const params =
    new URLSearchParams(
        window.location.search
    );


const imageURL =
    params.get("image") || "";


const titleText =
    params.get("title") || "";



/* =========================================================
   HTML要素
========================================================= */


const messageText =
    document.getElementById(
        "messageText"
    );


const openButton =
    document.getElementById(
        "openButton"
    );



/* =========================================================
   viewer URL作成
========================================================= */


function makeViewerURL() {

    const viewerParams =
        new URLSearchParams();


    if (imageURL) {

        viewerParams.set(
            "image",
            imageURL
        );

    }


    if (titleText) {

        viewerParams.set(
            "title",
            titleText
        );

    }


    return (
        VIEWER_URL +
        "?" +
        viewerParams.toString()
    );

}



/* =========================================================
   active viewer情報取得
========================================================= */


function getActiveViewerInfo() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return null;

        }


        const info =
            JSON.parse(raw);


        if (!info ||
            !info.id) {

            return null;

        }


        /*
           timestampが存在する場合は、
           古い情報を無効とする
        */

        if (info.timestamp) {

            const age =
                Date.now() -
                Number(info.timestamp);


            if (age >
                ACTIVE_VIEWER_VALID_TIME) {

                return null;

            }

        }


        return info;

    }
    catch (error) {

        console.error(
            "active viewer information error:",
            error
        );

        return null;

    }

}



/* =========================================================
   viewer request保存
========================================================= */


function saveViewerRequest(
    targetViewerId
) {

    const request = {

        image:
            imageURL,

        title:
            titleText,

        timestamp:
            Date.now(),

        targetViewerId:
            targetViewerId

    };


    try {

        localStorage.setItem(
            VIEWER_STORAGE_KEY,
            JSON.stringify(request)
        );

        return true;

    }
    catch (error) {

        console.error(
            "viewer request storage error:",
            error
        );

        return false;

    }

}



/* =========================================================
   launcherを閉じる
========================================================= */


function closeLauncher() {

    setTimeout(
        function () {

            try {

                window.close();

            }
            catch (error) {

                // ignore

            }

        },
        100
    );

}



/* =========================================================
   エラー／ボタン表示
========================================================= */


function showOpenButton(
    message
) {

    messageText.innerHTML =
        message;


    openButton.style.display =
        "inline-block";

}



/* =========================================================
   既存viewerへ画像変更要求
========================================================= */


function sendToExistingViewer(
    viewerInfo
) {

    if (!viewerInfo ||
        !viewerInfo.id) {

        return false;

    }


    const success =
        saveViewerRequest(
            viewerInfo.id
        );


    if (!success) {

        return false;

    }


    messageText.innerHTML =
        "既存のビューアに画像を表示しています…";


    /*
       viewer側がstorageイベントを
       受け取って画像を変更する
    */

    closeLauncher();


    return true;

}



/* =========================================================
   新しいviewerを開く
========================================================= */


function openNewViewer() {

    let viewerWindow = null;


    try {

        /*
           ここでは必ずURLを指定する。

           "" を指定すると、
           about:blankだけのタブを作ってしまう。
        */

        viewerWindow =
            window.open(
                makeViewerURL(),
                WINDOW_NAME
            );

    }
    catch (error) {

        console.error(
            "window.open error:",
            error
        );

    }


    if (!viewerWindow) {

        showOpenButton(
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

        return false;

    }


    try {

        viewerWindow.focus();

    }
    catch (error) {

        // ignore

    }


    /*
       viewerの読み込みを待つため、
       launcherを閉じる。
    */

    closeLauncher();


    return true;

}



/* =========================================================
   viewerを開く／既存viewerを利用する
========================================================= */


function openViewer() {

    if (!imageURL) {

        messageText.innerHTML =
            "画像URLが指定されていません。";

        openButton.style.display =
            "none";

        return;

    }


    /*
       まず既存viewerを確認する。

       ここが今回の重要な変更点。
       既存viewerがある場合は
       window.open()を呼ばない。
    */

    const activeViewerInfo =
        getActiveViewerInfo();


    if (activeViewerInfo) {

        /*
           既存viewerがある
        */

        const success =
            sendToExistingViewer(
                activeViewerInfo
            );


        if (success) {

            return;

        }

    }


    /*
       既存viewerがない場合だけ
       新しいviewerを開く。
    */

    openNewViewer();

}



/* =========================================================
   「ビューアを開く」ボタン
========================================================= */


openButton.addEventListener(
    "click",
    function () {

        /*
           ボタンのクリックは
           ユーザー操作なので、
           popup blockerに許可されやすい。
        */

        openViewer();

    }
);



/* =========================================================
   初期処理
========================================================= */


if (!imageURL) {

    messageText.innerHTML =
        "画像URLが指定されていません。";

}
else {

    openViewer();

}


</script>

</body>

</html>
