<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>画像ビューアを開いています</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family: sans-serif;
}

#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;
}

#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;
}

</style>

</head>


<body>

<div id="message">

    <div id="messageText">
        画像ビューアを開いています…
    </div>

    <button id="openButton">
        ビューアを開く
    </button>

</div>


<script>

/* =========================================================
   設定
========================================================= */


/*
   viewerのURL
*/

const VIEWER_URL =
    "https://funadamari.github.io/viewer/";


/*
   viewerとの情報交換に使用する
   localStorageキー
*/

const STORAGE_KEY =
    "funadamariViewerRequest";


/*
   現在使用中のviewerを示すキー
*/

const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   viewerを再利用するための
   ウィンドウ名

   重要：
   毎回同じ名前を使用する。
*/

const WINDOW_NAME =
    "funadamariViewer";


/* =========================================================
   URL parameters
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const imageURL =
    params.get("image");


const titleText =
    params.get("title") || "";


/* =========================================================
   HTML elements
========================================================= */

const messageText =
    document.getElementById(
        "messageText"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


/* =========================================================
   Viewer URL作成
========================================================= */

function makeViewerURL() {

    const viewerParams =
        new URLSearchParams();


    if (imageURL) {

        viewerParams.set(
            "image",
            imageURL
        );

    }


    if (titleText) {

        viewerParams.set(
            "title",
            titleText
        );

    }


    return (
        VIEWER_URL +
        "?" +
        viewerParams.toString()
    );

}


/* =========================================================
   viewerへのリクエストを保存
========================================================= */

function saveViewerRequest() {

    const request = {

        image:
            imageURL || "",

        title:
            titleText || "",

        timestamp:
            Date.now()

    };


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(request)
        );

        return true;

    }
    catch (error) {

        console.error(
            "localStorage error:",
            error
        );

        return false;

    }

}


/* =========================================================
   Viewerを開く
========================================================= */

function openViewer() {

    /*
       画像URLがない場合
    */

    if (!imageURL) {

        messageText.innerHTML =
            "画像URLが指定されていません。";

        openButton.style.display =
            "none";

        return;

    }


    /*
       まずviewerへのリクエストを保存
    */

    saveViewerRequest();


    /*
       viewerを開く。

       同じWINDOW_NAMEを指定することで、

       ・viewerが存在しない
           → 新しいviewerを開く

       ・viewerが存在する
           → 既存viewerを再利用

       という動作を期待する。
    */

    let viewerWindow = null;


    try {

        viewerWindow =
            window.open(
                makeViewerURL(),
                WINDOW_NAME
            );

    }
    catch (error) {

        console.error(
            "window.open error:",
            error
        );

    }


    /* =====================================================
       window.openがブロックされた場合
    ===================================================== */

    if (!viewerWindow) {

        messageText.innerHTML =
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。";

        openButton.style.display =
            "inline-block";

        return;

    }


    /* =====================================================
       viewerをアクティブviewerとして登録する
    ===================================================== */

    /*
       実際のviewer側でも登録するが、
       launcher側でも「現在このviewerを
       使用する」という情報を記録する。
    */

    try {

        localStorage.setItem(
            ACTIVE_VIEWER_KEY,
            Date.now().toString()
        );

    }
    catch (error) {

        console.error(
            "active viewer storage error:",
            error
        );

    }


    /* =====================================================
       viewerにフォーカス
    ===================================================== */

    try {

        viewerWindow.focus();

    }
    catch (error) {

        // ignore

    }


    /* =====================================================
       launcherを閉じる
    ===================================================== */

    setTimeout(
        function () {

            try {

                window.close();

            }
            catch (error) {

                // ignore

            }

        },
        100
    );

}


/* =========================================================
   「ビューアを開く」ボタン
========================================================= */

openButton.addEventListener(
    "click",
    function () {

        openViewer();

    }
);


/* =========================================================
   初期処理
========================================================= */

if (!imageURL) {

    messageText.innerHTML =
        "画像URLが指定されていません。";

}
else {

    /*
       自動的にviewerを開いてみる。

       ブラウザがポップアップを許可すれば
       そのままviewerが開く。

       ブロックされた場合は、
       「ビューアを開く」ボタンを表示する。
    */

    openViewer();

}

</script>

</body>

</html>
