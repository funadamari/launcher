<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>画像ビューアを開いています</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family: sans-serif;
}

#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;
}

#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;
}

</style>

</head>


<body>

<div id="message">

    <div id="messageText">
        画像ビューアを開いています…
    </div>

    <button id="openButton">
        ビューアを開く
    </button>

</div>


<script>

/* =========================================================
   設定
========================================================= */

const VIEWER_URL =
    "https://funadamari.github.io/viewer/";

const STORAGE_KEY =
    "funadamariViewerRequest";

const WINDOW_NAME =
    "funadamariViewer";


/* =========================================================
   URL parameters
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const imageURL =
    params.get("image");

const titleText =
    params.get("title") || "";


/* =========================================================
   要素
========================================================= */

const messageText =
    document.getElementById("messageText");

const openButton =
    document.getElementById("openButton");


/* =========================================================
   Viewer URL作成
========================================================= */

function makeViewerURL() {

    const viewerParams =
        new URLSearchParams();

    if (imageURL) {

        viewerParams.set(
            "image",
            imageURL
        );

    }

    if (titleText) {

        viewerParams.set(
            "title",
            titleText
        );

    }

    return (
        VIEWER_URL +
        "?" +
        viewerParams.toString()
    );

}


/* =========================================================
   Viewerへのリクエストを保存
========================================================= */

function saveViewerRequest() {

    const request = {

        image: imageURL || "",

        title: titleText || "",

        timestamp: Date.now()

    };

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(request)
        );

        return true;

    } catch (error) {

        console.error(
            "localStorage error:",
            error
        );

        return false;

    }

}


/* =========================================================
   Viewerを開く
========================================================= */

function openViewer() {

    /* -----------------------------------------
       画像URL確認
    ----------------------------------------- */

    if (!imageURL) {

        messageText.innerHTML =
            "画像URLが指定されていません。";

        openButton.style.display = "none";

        return;

    }


    /* -----------------------------------------
       viewerへの情報を保存
    ----------------------------------------- */

    saveViewerRequest();


    /* -----------------------------------------
       viewerを開く
    ----------------------------------------- */

    let viewerWindow = null;

    try {

        viewerWindow =
            window.open(
                makeViewerURL(),
                WINDOW_NAME
            );

    } catch (error) {

        console.error(
            "window.open error:",
            error
        );

    }


    /* -----------------------------------------
       開けなかった場合
    ----------------------------------------- */

    if (!viewerWindow) {

        messageText.innerHTML =
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。";

        openButton.style.display =
            "inline-block";

        return;

    }


    /* -----------------------------------------
       viewerにフォーカス
    ----------------------------------------- */

    try {

        viewerWindow.focus();

    } catch (error) {

        // ignore

    }


    /* -----------------------------------------
       launcherを閉じる
    ----------------------------------------- */

    setTimeout(
        function () {

            try {

                window.close();

            } catch (error) {

                // ignore

            }

        },
        100
    );

}


/* =========================================================
   ボタン
========================================================= */

openButton.addEventListener(
    "click",
    function () {

        openViewer();

    }
);


/* =========================================================
   初期処理
========================================================= */

if (!imageURL) {

    messageText.innerHTML =
        "画像URLが指定されていません。";

} else {

    /*
       重要：
       setTimeoutからwindow.open()を呼ばず、
       ページ読み込み時に直接実行する。
    */

    openViewer();

}

</script>

</body>

</html>
