<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>画像ビューアを開いています</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family: sans-serif;
}

#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;
}

#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;
}

</style>

</head>


<body>

<div id="message">

    <div id="messageText">
        画像ビューアを開いています…
    </div>

    <button id="openButton">
        ビューアを開く
    </button>

</div>


<script>

/* =========================================================
   設定
========================================================= */


/*
   viewerのURL
*/

const VIEWER_URL =
    "https://funadamari.github.io/viewer/";


/*
   viewerとの情報交換用localStorage
*/

const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


/*
   現在アクティブなviewerの情報
*/

const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   viewerを再利用するための名前

   重要：
   常に同じ名前を使用する。
*/

const WINDOW_NAME =
    "funadamariViewer";


/*
   viewerが開くまで待つ時間

   新規viewerの場合に、
   viewer側が自分のIDを登録するまで
   少し待つために使用する。
*/

const VIEWER_START_WAIT =
    500;


/* =========================================================
   URL parameters
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/*
   image

   URLSearchParamsのdecodeにより、
   %3A、%2Fなどは自動的に元に戻る。
*/

const imageURL =
    params.get("image") || "";


/*
   title
*/

const titleText =
    params.get("title") || "";


/* =========================================================
   HTML elements
========================================================= */

const messageText =
    document.getElementById(
        "messageText"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


/* =========================================================
   Viewer URL作成
========================================================= */

function makeViewerURL() {

    const viewerParams =
        new URLSearchParams();


    if (imageURL) {

        viewerParams.set(
            "image",
            imageURL
        );

    }


    if (titleText) {

        viewerParams.set(
            "title",
            titleText
        );

    }


    return (
        VIEWER_URL +
        "?" +
        viewerParams.toString()
    );

}


/* =========================================================
   現在のactive viewer情報を取得
========================================================= */

function getActiveViewerInfo() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return null;

        }


        const info =
            JSON.parse(raw);


        if (!info ||
            !info.id) {

            return null;

        }


        return info;

    }
    catch (error) {

        console.error(
            "active viewer information error:",
            error
        );

        return null;

    }

}


/* =========================================================
   Viewer requestを保存
========================================================= */

function saveViewerRequest(
    targetViewerId
) {

    const request = {

        image:
            imageURL,

        title:
            titleText,

        timestamp:
            Date.now(),

        targetViewerId:
            targetViewerId || ""

    };


    try {

        localStorage.setItem(
            VIEWER_STORAGE_KEY,
            JSON.stringify(request)
        );

        return true;

    }
    catch (error) {

        console.error(
            "viewer request storage error:",
            error
        );

        return false;

    }

}


/* =========================================================
   エラー表示
========================================================= */

function showOpenButton(
    message
) {

    messageText.innerHTML =
        message;

    openButton.style.display =
        "inline-block";

}


/* =========================================================
   launcherを閉じる
========================================================= */

function closeLauncher() {

    setTimeout(
        function () {

            try {

                window.close();

            }
            catch (error) {

                // ignore

            }

        },
        100
    );

}


/* =========================================================
   viewerを開く／再利用する
========================================================= */

function openViewer() {

    /* -----------------------------------------------------
       画像URL確認
    ----------------------------------------------------- */

    if (!imageURL) {

        messageText.innerHTML =
            "画像URLが指定されていません。";

        openButton.style.display =
            "none";

        return;

    }


    /* -----------------------------------------------------
       現在のactive viewerを取得
    ----------------------------------------------------- */

    const activeInfo =
        getActiveViewerInfo();


    const activeViewerId =
        activeInfo
            ? activeInfo.id
            : "";


    /*
       まずviewerを名前で取得する。

       既存viewerがあれば、
       そのviewerが返される。

       存在しなければ、
       新しいウィンドウ／タブが作られる。
    */

    let viewerWindow = null;


    try {

        /*
           既存viewerを再利用する場合は
           about:blank等へ移動させないため、
           空文字を指定する。

           既存viewerがない場合は
           新しい空のviewerウィンドウを
           作る。
        */

        viewerWindow =
            window.open(
                "",
                WINDOW_NAME
            );

    }
    catch (error) {

        console.error(
            "window.open error:",
            error
        );

    }


    /* -----------------------------------------------------
       window.open失敗
    ----------------------------------------------------- */

    if (!viewerWindow) {

        showOpenButton(
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

        return;

    }


    /* -----------------------------------------------------
       active viewerが存在する場合
    ----------------------------------------------------- */

    if (activeViewerId) {

        /*
           既存viewerに対して、
           今回の画像を送る。

           viewer自身は移動させない。
        */

        saveViewerRequest(
            activeViewerId
        );


        /*
           viewerにフォーカス
        */

        try {

            viewerWindow.focus();

        }
        catch (error) {

            // ignore

        }


        /*
           launcherを閉じる
        */

        closeLauncher();

        return;

    }


    /* -----------------------------------------------------
       active viewerが存在しない場合
       → 新しいviewer
    ----------------------------------------------------- */

    try {

        /*
           新規viewerの場合は、
           先ほどwindow.open()で作った
           空のウィンドウをviewerにする。

           location.hrefを変更することで、
           このウィンドウ自身がviewerになる。
        */

        viewerWindow.location.href =
            makeViewerURL();

    }
    catch (error) {

        console.error(
            "viewer navigation error:",
            error
        );


        showOpenButton(
            "ビューアを開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

        return;

    }


    /*
       viewerにフォーカス
    */

    try {

        viewerWindow.focus();

    }
    catch (error) {

        // ignore

    }


    /*
       launcherを閉じる
    */

    closeLauncher();

}


/* =========================================================
   「ビューアを開く」ボタン
========================================================= */

openButton.addEventListener(
    "click",
    function () {

        openViewer();

    }
);


/* =========================================================
   初期処理
========================================================= */

if (!imageURL) {

    messageText.innerHTML =
        "画像URLが指定されていません。";

}
else {

    /*
       自動的にviewerを開く。

       ブラウザが許可すれば
       そのまま処理される。

       ポップアップとして拒否された場合だけ
       ボタンを表示する。
    */

    openViewer();

}

</script>

</body>

</html>
