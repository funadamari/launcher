<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>画像ビューアを開いています</title>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family: sans-serif;

}


#message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    max-width: 500px;

    text-align: center;

    line-height: 1.7;

}


#openButton {

    display: none;

    margin-top: 20px;

    padding: 12px 24px;

    border: none;

    border-radius: 6px;

    background: #fff;

    color: #111;

    font-size: 16px;

    cursor: pointer;

}

</style>

</head>


<body>


<div id="message">

    <div id="messageText">
        画像ビューアを開いています…
    </div>

    <button
        id="openButton"
        type="button">
        ビューアを開く
    </button>

</div>


<script>


/* =========================================================
   設定
========================================================= */

const SERVICE_WORKER_URL =
    "/sw.js";


const SERVICE_WORKER_REQUEST =
    "funadamariServiceWorkerRequest";


/* =========================================================
   URL parameters
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const imageURL =
    params.get("image") || "";


const titleText =
    params.get("title") || "";


/* =========================================================
   HTML
========================================================= */

const messageText =
    document.getElementById(
        "messageText"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


/* =========================================================
   launcherを閉じる
========================================================= */

function closeLauncher() {

    setTimeout(
        function () {

            try {

                window.close();

            }
            catch (error) {

                // ignore

            }

        },
        100
    );

}


/* =========================================================
   エラー表示
========================================================= */

function showOpenButton(
    message
) {

    messageText.innerHTML =
        message;

    openButton.style.display =
        "inline-block";

}


/* =========================================================
   Service Workerへ要求
========================================================= */

async function sendToServiceWorker() {

    if (!imageURL) {

        messageText.textContent =
            "画像URLが指定されていません。";

        return;

    }


    /*
       Service Workerが使用可能か確認
    */

    if (
        !("serviceWorker" in navigator)
    ) {

        showOpenButton(
            "このブラウザではビューアを自動的に開けません。"
        );

        return;

    }


    try {

        /*
           Service Workerを登録
        */

        const registration =
            await navigator.serviceWorker.register(
                SERVICE_WORKER_URL,
                {
                    scope: "/"
                }
            );


        /*
           Service Workerが有効になるまで待つ
        */

        await navigator.serviceWorker.ready;


        /*
           controllerがまだ存在しない場合、
           active workerを使用する。
        */

        const worker =
            navigator.serviceWorker.controller ||
            registration.active;


        if (!worker) {

            /*
               初回登録直後の場合、
               次回アクセス時にはcontrollerが
               設定される。

               ただし今回の処理を続けるため、
               registration.activeを少し待つ。
            */

            let activeWorker =
                registration.active;


            const start =
                Date.now();


            while (
                !activeWorker &&
                Date.now() - start < 3000
            ) {

                await new Promise(
                    function (resolve) {

                        setTimeout(
                            resolve,
                            100
                        );

                    }
                );


                activeWorker =
                    registration.active;

            }


            if (!activeWorker) {

                showOpenButton(
                    "ビューアを開けませんでした。<br>" +
                    "下のボタンを押してください。"
                );

                return;

            }


            activeWorker.postMessage({

                type:
                    SERVICE_WORKER_REQUEST,

                image:
                    imageURL,

                title:
                    titleText

            });

        }
        else {

            worker.postMessage({

                type:
                    SERVICE_WORKER_REQUEST,

                image:
                    imageURL,

                title:
                    titleText

            });

        }


        /*
           Service Workerへの送信完了。

           viewerが既にあればfocusされ、
           なければ新規viewerが開く。
        */

        closeLauncher();

    }
    catch (error) {

        console.error(
            "Service Worker error:",
            error
        );


        showOpenButton(
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

    }

}


/* =========================================================
   ボタン
========================================================= */

openButton.addEventListener(
    "click",
    function () {

        /*
           このクリックが
           WindowClient.focus()に必要な
           transient activationになる。

           したがって余計なsetTimeoutなどを
           ここに入れない。
        */

        sendToServiceWorker();

    }
);


/* =========================================================
   初期処理
========================================================= */

if (!imageURL) {

    messageText.textContent =
        "画像URLが指定されていません。";

}
else {

    /*
       自動実行。

       Google Sitesからlauncherが開かれた
       だけの場合、ここではfocusできない
       可能性がある。

       その場合はボタンを表示する。
    */

    if (
        "serviceWorker" in navigator
    ) {

        /*
           自動実行ではpopup/focusが
           ブロックされる可能性があるため、
           一旦ボタン方式にする。

           初回画像ではこれまでと同じく
           「ビューアを開く」が表示される。
        */

        showOpenButton(
            "ビューアを開いています。<br>" +
            "下のボタンを押してください。"
        );

    }
    else {

        showOpenButton(
            "ビューアを自動的に開けませんでした。<br>" +
            "下のボタンを押してください。"
        );

    }

}

</script>

</body>

</html>
